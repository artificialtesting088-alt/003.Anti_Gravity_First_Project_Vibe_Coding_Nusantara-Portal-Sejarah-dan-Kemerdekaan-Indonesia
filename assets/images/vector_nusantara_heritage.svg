<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 400' width='100%' height='100%'>
  <defs>
    <linearGradient id='heritageGrad' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#C8102E' stop-opacity='0.3' />
      <stop offset='60%' stop-color='#F59E0B' stop-opacity='0.25' />
      <stop offset='100%' stop-color='#FEF3C7' stop-opacity='0.1' />
    </linearGradient>
    <filter id='softGlow' x='-10%' y='-10%' width='120%' height='120%'>
      <feGaussianBlur stdDeviation='3' result='blur' />
      <feMerge>
        <feMergeNode in='blur' />
        <feMergeNode in='SourceGraphic' />
      </feMerge>
    </filter>
  </defs>

  <!-- Distant Mountain Ridges (Gunung Merapi / Semeru) -->
  <path d='M0,280 Q160,180 320,250 T640,220 T960,260 T1200,210 L1200,400 L0,400 Z' fill='#C8102E' fill-opacity='0.06' />
  <path d='M0,310 Q200,240 420,280 T840,270 T1200,290 L1200,400 L0,400 Z' fill='#F59E0B' fill-opacity='0.08' />

  <!-- Left: Candi Borobudur & Stupa Complex Silhouette -->
  <g fill='url(#heritageGrad)' filter='url(#softGlow)' stroke='#F59E0B' stroke-width='1' stroke-opacity='0.4'>
    <!-- Base Terraces of Borobudur -->
    <rect x='40' y='360' width='340' height='20' rx='2' />
    <rect x='65' y='342' width='290' height='18' rx='2' />
    <rect x='90' y='325' width='240' height='17' rx='2' />
    <rect x='115' y='310' width='190' height='15' rx='2' />
    
    <!-- Circular Terraces & Minor Stupas -->
    <!-- Stupa 1 (Left) -->
    <path d='M130,310 C130,290 145,280 150,260 C155,280 170,290 170,310 Z' />
    <line x1='150' y1='260' x2='150' y2='245' stroke='#F59E0B' stroke-width='2' />
    <!-- Stupa 2 -->
    <path d='M175,310 C175,288 190,278 195,258 C200,278 215,288 215,310 Z' />
    <line x1='195' y1='258' x2='195' y2='243' stroke='#F59E0B' stroke-width='2' />
    <!-- Main Central Stupa Borobudur -->
    <path d='M180,310 C180,265 200,240 210,195 C220,240 240,265 240,310 Z' />
    <line x1='210' y1='195' x2='210' y2='165' stroke='#F59E0B' stroke-width='3' />
    <circle cx='210' cy='163' r='3' fill='#F59E0B' />
    <!-- Stupa 3 -->
    <path d='M235,310 C235,288 250,278 255,258 C260,278 275,288 275,310 Z' />
    <line x1='255' y1='258' x2='255' y2='243' stroke='#F59E0B' stroke-width='2' />
    <!-- Stupa 4 (Right) -->
    <path d='M280,310 C280,290 295,280 300,260 C305,280 320,290 320,310 Z' />
    <line x1='300' y1='260' x2='300' y2='245' stroke='#F59E0B' stroke-width='2' />
  </g>

  <!-- Center-Right: Kapal Jung / Pinisi Layar Sriwijaya & Majapahit -->
  <g fill='url(#heritageGrad)' filter='url(#softGlow)' stroke='#F59E0B' stroke-width='1.2' stroke-opacity='0.45'>
    <!-- Curved Ship Hull (Badan Kapal) -->
    <path d='M760,340 C780,370 880,380 970,365 C1030,355 1060,330 1080,315 C1050,335 980,345 880,345 C800,345 770,330 760,340 Z' />
    <!-- Ocean Waves at Hull -->
    <path d='M730,365 Q760,355 790,365 T850,365 T910,365 T970,365 T1030,365 T1090,365' fill='none' stroke='#F59E0B' stroke-width='2' stroke-opacity='0.5' />
    <path d='M700,380 Q740,370 780,380 T860,380 T940,380 T1020,380 T1100,380' fill='none' stroke='#C8102E' stroke-width='1.5' stroke-opacity='0.4' />

    <!-- Outrigger / Katir Cadik -->
    <line x1='800' y1='360' x2='800' y2='375' stroke='#D97706' stroke-width='2' />
    <line x1='940' y1='360' x2='940' y2='375' stroke='#D97706' stroke-width='2' />
    <line x1='770' y1='375' x2='970' y2='375' stroke='#F59E0B' stroke-width='3' stroke-linecap='round' />

    <!-- Main Mast (Tiang Layar Utama) -->
    <line x1='870' y1='170' x2='870' y2='345' stroke='#D97706' stroke-width='3.5' />
    <line x1='970' y1='195' x2='970' y2='345' stroke='#D97706' stroke-width='3' />
    <line x1='790' y1='220' x2='790' y2='345' stroke='#D97706' stroke-width='2.5' />

    <!-- Majestic Tanja / Pinisi Sails (Layar Berkibar) -->
    <!-- Main Sail -->
    <path d='M870,180 C895,200 930,230 920,295 C885,285 860,270 870,180 Z' />
    <path d='M870,180 C845,200 820,230 830,295 C855,285 870,270 870,180 Z' />
    <!-- Rear Sail -->
    <path d='M970,205 C990,225 1015,245 1010,300 C985,290 965,280 970,205 Z' />
    <!-- Front Jib Sail -->
    <path d='M790,230 C765,250 745,270 760,310 C780,295 790,280 790,230 Z' />
    <!-- Pennant Flag on Top of Mast -->
    <polygon points='870,170 840,162 870,155' fill='#C8102E' stroke='#C8102E' stroke-width='1' />
  </g>

  <!-- Far Right: Keris Luk Pusaka Silhouette -->
  <g fill='url(#heritageGrad)' filter='url(#softGlow)' stroke='#F59E0B' stroke-width='1.5' stroke-opacity='0.4'>
    <!-- Keris Blade with Sacred Luk Curves -->
    <path d='M580,90 Q595,120 580,150 Q565,180 580,210 Q595,240 580,270 Q565,300 585,330 L595,330 Q575,300 590,270 Q605,240 590,210 Q575,180 590,150 Q605,120 585,90 Z' />
    <!-- Ganja & Warangka/Handle -->
    <path d='M565,330 L610,330 L600,345 L575,345 Z' />
    <path d='M582,345 C580,360 595,375 588,390 L598,390 C605,375 590,360 592,345 Z' />
  </g>

  <!-- Ground Horizon Baseline -->
  <line x1='0' y1='385' x2='1200' y2='385' stroke='#C8102E' stroke-width='1' stroke-opacity='0.25' />
</svg>