    <!-- Papua (Irian Jaya & Raja Ampat) -->
    <ellipse cx='815' cy='175' rx='12' ry='10' />
    <path d='M835,185 Q925,155 1010,175 Q1075,205 1095,290 Q1015,325 930,295 Q880,285 860,242 Q828,220 835,185 Z' />
    <path d='M820,205 Q840,185 860,218 L840,238 Z' opacity='0.7' />
  </g>
</svg>