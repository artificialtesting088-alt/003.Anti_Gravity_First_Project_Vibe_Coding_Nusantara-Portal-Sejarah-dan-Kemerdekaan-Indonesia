<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 600' width='100%' height='100%'>
  <defs>
    <linearGradient id='proklGrad' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#991B1B' stop-opacity='0.6' />
      <stop offset='45%' stop-color='#C8102E' stop-opacity='0.7' />
      <stop offset='80%' stop-color='#F59E0B' stop-opacity='0.75' />
      <stop offset='100%' stop-color='#FEF3C7' stop-opacity='0.4' />
    </linearGradient>
    <radialGradient id='dawnGlow' cx='50%' cy='50%' r='60%'>
      <stop offset='0%' stop-color='#F59E0B' stop-opacity='0.4' />
      <stop offset='40%' stop-color='#C8102E' stop-opacity='0.2' />
      <stop offset='100%' stop-color='#C8102E' stop-opacity='0' />
    </radialGradient>
    <filter id='proklGlow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='3' result='blur' />
      <feMerge>
        <feMergeNode in='blur' />
        <feMergeNode in='SourceGraphic' />
      </feMerge>
    </filter>
  </defs>

  <!-- Central Radiant Sunburst of Freedom -->
  <circle cx='600' cy='360' r='380' fill='url(#dawnGlow)' />
  <g stroke='#F59E0B' stroke-width='1.5' stroke-opacity='0.35' stroke-dasharray='6,8'>
    <line x1='600' y1='360' x2='60' y2='80' />
    <line x1='600' y1='360' x2='220' y2='30' />
    <line x1='600' y1='360' x2='400' y2='10' />
    <line x1='600' y1='360' x2='600' y2='0' />
    <line x1='600' y1='360' x2='800' y2='10' />
    <line x1='600' y1='360' x2='980' y2='30' />
    <line x1='600' y1='360' x2='1140' y2='80' />
    <line x1='600' y1='360' x2='1180' y2='220' />
    <line x1='600' y1='360' x2='20' y2='220' />
  </g>

  <!-- Pegangsaan Timur Veranda Architectural Pillars & Beam -->
  <g fill='#C8102E' fill-opacity='0.15' stroke='#F59E0B' stroke-width='1.5' stroke-opacity='0.3'>
    <!-- Far Left Pillar -->
    <rect x='40' y='60' width='36' height='540' rx='4' />
    <rect x='30' y='50' width='56' height='14' rx='3' />
    <!-- Far Right Pillar -->
    <rect x='1124' y='60' width='36' height='540' rx='4' />
    <rect x='1114' y='50' width='56' height='14' rx='3' />
    <!-- Roof Beam -->
    <path d='M20,50 L1180,50 L1160,25 L40,25 Z' />
    <!-- Veranda Lantern -->
    <line x1='600' y1='25' x2='600' y2='90' stroke='#D97706' stroke-width='2.5' />
    <polygon points='600,90 588,110 612,110' fill='#F59E0B' fill-opacity='0.6' stroke='#D97706' />
    <circle cx='600' cy='118' r='10' fill='#FEF3C7' fill-opacity='0.9' />
  </g>

  <!-- ==================== LEFT FLANK: SANG SAKA MERAH PUTIH & PEJUANG ==================== -->
  <g id='left-flank'>
    <!-- Bamboo Flagpole -->
    <line x1='120' y1='40' x2='120' y2='590' stroke='#D97706' stroke-width='7' stroke-linecap='round' />
    <polygon points='120,25 114,42 126,42' fill='#F59E0B' />

    <!-- Big Fluttering Sang Saka Merah Putih Flag -->
    <!-- Red Top -->
    <path d='M120,50 C180,25 220,80 290,60 C330,50 360,75 390,65 L390,140 C360,150 330,125 290,135 C220,155 180,100 120,125 Z' 
          fill='#C8102E' fill-opacity='0.88' stroke='#C8102E' stroke-width='2' />
    <!-- White Bottom -->
    <path d='M120,125 C180,100 220,155 290,135 C330,125 360,150 390,140 L390,215 C360,225 330,200 290,210 C220,230 180,175 120,200 Z' 
          fill='#FFFFFF' fill-opacity='0.92' stroke='#CBD5E1' stroke-width='2' />

    <!-- Latief Hendraningrat & Suhud raising flag silhouette -->
    <g fill='url(#proklGrad)' filter='url(#proklGlow)' stroke='#F59E0B' stroke-width='1.2' stroke-opacity='0.5'>
      <!-- PETA Officer (Topi Tentara PETA & Safari PETA) -->
      <path d='M140,240 C135,235 150,230 165,230 C180,230 195,235 190,240 L195,250 L135,250 Z' />
      <ellipse cx='165' cy='265' rx='16' ry='18' />
      <path d='M145,285 C135,310 130,350 125,430 L120,590 L200,590 L200,430 C195,350 190,310 180,285 Z' />
      <!-- Arms pulling halyard rope -->
      <path d='M145,300 L125,230 C122,225 115,228 118,235 L135,310 Z' />
      <path d='M175,300 L125,180 C122,175 115,178 118,185 L165,310 Z' />
      
      <!-- Pemuda Pejuang behind with raised fist -->
      <ellipse cx='235' cy='320' rx='15' ry='17' />
      <path d='M215,340 C205,365 200,410 195,490 L190,590 L270,590 L265,490 C260,410 255,365 245,340 Z' />
      <!-- Raised Clenched Fist in Triumph -->
      <path d='M245,350 L275,260 C278,255 288,258 285,268 L255,360 Z' />
      <circle cx='280' cy='255' r='8' fill='#F59E0B' />
    </g>
  </g>

  <!-- ==================== RIGHT FLANK: BUNG KARNO AT MIC & BUNG HATTA ==================== -->
  <g id='right-flank'>
    <!-- Bung Hatta Silhouette (Standing with hands by side, glasses, peci) -->
    <g fill='url(#proklGrad)' filter='url(#proklGlow)' stroke='#F59E0B' stroke-width='1.5' stroke-opacity='0.6'>
      <!-- Peci Hatta -->
      <path d='M880,180 C880,165 900,155 925,155 C950,155 970,165 970,180 L972,200 L878,200 Z' />
      <!-- Head & Glasses -->
      <ellipse cx='925' cy='222' rx='24' ry='26' />
      <circle cx='916' cy='220' r='6' fill='none' stroke='#F59E0B' stroke-width='2' />
      <circle cx='934' cy='220' r='6' fill='none' stroke='#F59E0B' stroke-width='2' />
      <line x1='922' y1='220' x2='928' y2='220' stroke='#F59E0B' stroke-width='2' />
      <!-- Double-Breasted Suit Body -->
      <path d='M885,250 C855,285 845,340 840,430 L830,590 L980,590 L975,430 C970,340 960,285 935,250 Z' />
      <polygon points='925,255 918,320 925,338 932,320' fill='#F59E0B' fill-opacity='0.6' />
    </g>

    <!-- Bung Karno Silhouette (Central Hero, Holding Proklamasi Paper at Mic) -->
    <g fill='url(#proklGrad)' filter='url(#proklGlow)' stroke='#F59E0B' stroke-width='1.5' stroke-opacity='0.65'>
      <!-- Peci Hitam Bung Karno -->
      <path d='M990,130 C990,112 1015,102 1045,102 C1075,102 1100,112 1100,130 L1103,155 L987,155 Z' />
      <!-- Head & Charismatic Orator Profile -->
      <path d='M995,155 C990,182 995,202 1015,212 C1032,220 1062,220 1080,212 C1098,202 1102,182 1098,155 Z' />
      <!-- White Safari Suit Body (Jas 4 Saku) -->
      <path d='M990,218 C950,248 935,310 925,420 L915,590 L1130,590 L1120,420 C1110,310 1095,248 1055,218 Z' />

      <!-- Safari Pockets -->
      <rect x='955' y='285' width='36' height='42' rx='3' fill='none' stroke='#F59E0B' stroke-width='1.2' stroke-opacity='0.5' />
      <rect x='1055' y='285' width='36' height='42' rx='3' fill='none' stroke='#F59E0B' stroke-width='1.2' stroke-opacity='0.5' />

      <!-- Left Arm & Hand Holding Teks Proklamasi Paper -->
      <path d='M955,270 L985,335 L1045,325 L1035,295 L980,260 Z' />
      <!-- Proclamation Document in Hand -->
      <polygon points='1030,300 1085,286 1092,348 1038,362' fill='#FFFDF7' stroke='#D97706' stroke-width='2' />
      <line x1='1042' y1='310' x2='1078' y2='302' stroke='#C8102E' stroke-width='1.5' />
      <line x1='1042' y1='320' x2='1080' y2='312' stroke='#334155' stroke-width='1.2' />
      <line x1='1042' y1='330' x2='1074' y2='322' stroke='#334155' stroke-width='1.2' />
      <line x1='1042' y1='340' x2='1066' y2='332' stroke='#C8102E' stroke-width='1.2' />

      <!-- Right Arm by Side -->
      <path d='M1095,260 L1122,350 L1105,420 L1085,400 L1102,340 Z' />
    </g>

    <!-- Historic Standing Microphone (Shure 55) -->
    <g id='microphone-right'>
      <!-- Microphone Head -->
      <rect x='1060' y='240' width='22' height='32' rx='10' fill='#F1F5F9' stroke='#C8102E' stroke-width='2' />
      <line x1='1063' y1='247' x2='1079' y2='247' stroke='#475569' stroke-width='1.5' />
      <line x1='1063' y1='254' x2='1079' y2='254' stroke='#475569' stroke-width='1.5' />
      <line x1='1063' y1='261' x2='1079' y2='261' stroke='#475569' stroke-width='1.5' />
      <line x1='1063' y1='268' x2='1079' y2='268' stroke='#475569' stroke-width='1.5' />
      <!-- Stand Joint -->
      <circle cx='1071' cy='277' r='5' fill='#94A3B8' stroke='#64748B' stroke-width='1.5' />
      <!-- Vertical Stand -->
      <line x1='1071' y1='277' x2='1071' y2='585' stroke='#CBD5E1' stroke-width='4' />
      <!-- Base -->
      <ellipse cx='1071' cy='585' rx='36' ry='12' fill='#334155' stroke='#F59E0B' stroke-width='2' />
      <!-- Cable -->
      <path d='M1071,575 C1090,582 1115,570 1140,585 C1160,595 1180,590 1200,592' fill='none' stroke='#1E293B' stroke-width='2.5' stroke-dasharray='4,4' />
    </g>
  </g>

  <!-- Ground Stone Floor Baseline -->
  <rect x='0' y='585' width='1200' height='15' fill='#C8102E' fill-opacity='0.35' />
  <line x1='0' y1='585' x2='1200' y2='585' stroke='#F59E0B' stroke-width='2.5' stroke-opacity='0.8' />
</svg>