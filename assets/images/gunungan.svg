<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500' width='300' height='500'>
  <defs>
    <linearGradient id='gununganGrad' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#C8102E' stop-opacity='0.25' />
      <stop offset='60%' stop-color='#F59E0B' stop-opacity='0.3' />
      <stop offset='100%' stop-color='#C8102E' stop-opacity='0.15' />
    </linearGradient>
    <filter id='goldGlow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='4' result='blur' />
      <feMerge>
        <feMergeNode in='blur' />
        <feMergeNode in='SourceGraphic' />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Gunungan Leaf Outline -->
  <path d='M150,20 C180,80 260,180 270,300 C275,370 240,430 180,450 L180,490 L120,490 L120,450 C60,430 25,370 30,300 C40,180 120,80 150,20 Z' 
        fill='url(#gununganGrad)' stroke='#F59E0B' stroke-width='2' stroke-opacity='0.45' filter='url(#goldGlow)' />
  <!-- Inner Border Line -->
  <path d='M150,45 C175,95 245,190 252,295 C256,355 225,410 170,430 L130,430 C75,410 44,355 48,295 C55,190 125,95 150,45 Z' 
        fill='none' stroke='#C8102E' stroke-width='1.5' stroke-opacity='0.4' />
  <!-- Pohon Hayat (Tree of Life Central Spine) -->
  <line x1='150' y1='60' x2='150' y2='430' stroke='#F59E0B' stroke-width='3' stroke-opacity='0.5' />
  <!-- Branches -->
  <path d='M150,140 Q190,110 210,140 Q180,160 150,160 Q120,160 90,140 Q110,110 150,140 Z' fill='none' stroke='#F59E0B' stroke-width='1.5' stroke-opacity='0.4' />
  <path d='M150,200 Q210,170 235,210 Q195,230 150,230 Q105,230 65,210 Q90,170 150,200 Z' fill='none' stroke='#C8102E' stroke-width='1.5' stroke-opacity='0.4' />
  <path d='M150,270 Q225,240 245,285 Q200,305 150,305 Q100,305 55,285 Q75,240 150,270 Z' fill='none' stroke='#F59E0B' stroke-width='1.5' stroke-opacity='0.4' />
  <!-- Gapura / Gate at Base -->
  <rect x='115' y='360' width='70' height='70' rx='6' fill='#C8102E' fill-opacity='0.15' stroke='#F59E0B' stroke-width='1.5' stroke-opacity='0.5' />
  <path d='M115,360 L150,330 L185,360 Z' fill='#F59E0B' fill-opacity='0.25' stroke='#F59E0B' stroke-width='1.5' stroke-opacity='0.5' />
  <line x1='150' y1='360' x2='150' y2='430' stroke='#C8102E' stroke-width='1.5' stroke-opacity='0.5' />
  <!-- Crown Tip Sun -->
  <circle cx='150' cy='30' r='6' fill='#F59E0B' fill-opacity='0.8' />
</svg>